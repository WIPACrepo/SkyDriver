name: image publish

# NOTE: release images are published by 'wipac-cicd.yml' (after tag-and-release)
#       this workflow is only for manual builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'the tag to publish and possibly overwrite'
        default: 'dev'
        required: false

permissions:  # default for all jobs (GITHUB_TOKEN) -- jobs widen as needed
  contents: read

jobs:
  image-publish:
    uses: WIPACrepo/wipac-dev-workflows/.github/workflows/image-publish.yml@v1.35
    permissions:  # for GITHUB_TOKEN
      contents: read
      packages: write  # push image to ghcr.io
    with:
      image_namespace: wipacrepo
      image_name: skydriver
      mode: BUILD
      extra_build_tag: ${{ inputs.tag }}
